[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deepconf"
version = "0.1.0"
description = "NNP-driven conformer generation for drug-like molecules"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "rdkit",
    "ase",
]

[project.optional-dependencies]
ani = ["torch", "torchani"]
aimnet2 = ["torch"]
nequip = ["torch", "nequip"]
all = ["torch", "torchani", "nequip"]

[project.scripts]
deepconf = "deepconf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepconf*"]

[tool.setuptools.package-data]
deepconf = ["models/*.pth"]
